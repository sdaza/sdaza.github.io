[project]
name = "sdaza-github-io-notebooks"
version = "0.1.0"
description = "Python environment for executing and converting _jupyter notebooks on this site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "weightpipe @ git+https://github.com/sdaza/weightpipe.git",
]

[dependency-groups]
dev = [
    "ipython>=8.0",
]

[tool.uv]
package = false
python-preference = "managed"
